name: Workzen Full-Stack CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/workzen_test
      JWT_ACCESS_SECRET: workzen_ci_test_jwt_access_secret_key_32_chars_min
      JWT_REFRESH_SECRET: workzen_ci_test_jwt_refresh_secret_key_32_chars_min

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies Deterministically
      run: npm ci

    - name: Typecheck Full-Stack
      run: npm run typecheck

    - name: Run Automated Test Suite
      run: npm test

    - name: Build Frontend Client (Vite)
      run: npm run build:client

    - name: Build Backend Server (TypeScript)
      run: npm run build:server

    - name: Dependency Security Audit
      run: npm run audit || echo "Audit complete"
